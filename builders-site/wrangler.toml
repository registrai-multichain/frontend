# Cloudflare Pages project for the standalone builders site, builder.registrai.cc
# (the /builders gallery, /verify, /admin and the badge art) plus its Pages
# Functions in ./functions (the admin API: sign-in, invites, open tracking).
#
# Deploy from frontend/: `npm run deploy:builders` (next build, then
# scripts/build-builders-site.sh packages ../dist-builders, then
# scripts/deploy-builders-site.sh runs `wrangler pages deploy` from THIS
# directory, which picks up ./functions and this file).
#
# The main site (registrai.cc, `npm run deploy`) deploys `out/` from frontend/
# and never sees these functions.
#
# With a wrangler.toml, this file is the source of truth for the project's
# bindings and variables: the dashboard shows them read-only.
name = "registrai-builders"
compatibility_date = "2026-05-01"
pages_build_output_dir = "../dist-builders"

# Invites, used sign-in nonces and admin sessions.
# Namespace "registrai-builders-invites", created 2026-09-24 with
#   npx wrangler kv namespace create registrai-builders-invites   (run from frontend/)
[[kv_namespaces]]
binding = "INVITES"
id = "9652d6f635d94fda8cf3d09ee182fa41"

# ABI points pilot (lib/pilot.ts, migrations/): accounts, positions, one-minute ABI bars, the latest mark.
# Create it once, then paste its database_id here (run from frontend/builders-site/):
#   npx wrangler d1 create registrai-pilot
#   npx wrangler d1 migrations apply registrai-pilot --remote
# scripts/deploy-builders-site.sh refuses to deploy while the id is the placeholder.
[[d1_databases]]
binding = "PILOT_DB"
database_name = "registrai-pilot"
database_id = "1f2199be-1828-4ebc-b0ff-d747f5cfc705"
migrations_dir = "migrations"

[vars]
# Wallets allowed to sign in to /admin: comma-separated, lowercase.
# Empty = nobody can sign in (the rest of the site works as before).
ADMIN_ADDRESSES = "0xb7ecf980a4732b75e57e2ec80903dee3964f2573"
# Onboarders sign in to /admin to READ and send onboarding from their own wallet (the
# ISSUER_ROLE + GOVERNOR_ROLE holder); every admin API change is refused for them.
ONBOARDER_ADDRESSES = "0x80e81588175558d565ffc1f63fe0513a61316405"
# Sign-in messages, the CSRF Origin check and claim links are bound to it.
SITE_ORIGIN = "https://builder.registrai.cc"
# The only origin /api/market-proposals accepts public submissions from (CORS).
PROPOSALS_ALLOWED_ORIGIN = "https://app.registrai.cc"
# ABI points pilot kill switch: "1" accepts new orders; anything else answers POST /api/pilot/order
# with 403 {error:"pilot closed"} and the ticket says "The points pilot is not open yet."
# Sign-in, closes, reads and the mark ingest work either way.
PILOT_OPEN = "0"
# Optional REGI snapshot (spec §8.4). Empty (the default; owner decision 2026-10-12: REGI is checked when each order
# is placed, not at a snapshot): no snapshot check. Set to a block IN THE PAST, a wallet may also open positions only
# if it held the admission amount (PILOT_ADMIT_USD of REGI at today's median) at that Arc block. With PILOT_OPEN = "1", a non-numeric, future (above the mark's head)
# or pre-REGI (< 22419071) block makes the pilot "misconfigured": every order is refused with "pilot misconfigured",
# the ticket says so, and the Worker logs it once per isolate (audit PE-7).
PILOT_REGI_SNAPSHOT_BLOCK = ""
# Dollars of REGI a wallet must hold at sign-in AND when it places each order (owner decisions 2026-10-13), read fresh
# from the RPC and converted at the median of the site's own REGI/USDC pool samples over the last 24 h (one per 10 min,
# taken during ABI mark posts; fewer than 6 = "REGI price updating", every admission refused). A wallet with open
# positions may always sign in to close. Not a positive number (≤ 2 decimals) = misconfigured.
PILOT_ADMIT_USD = "10"
# Dollars of REGI a wallet must have locked in its own RegiVault (RegiLockFactory.lockedOf, read fresh) to place an
# order above 1×. Each position keeps the requirement in force when it opened; withdrawing below it closes the position
# at the next mark (the withdrawal watch, once a minute during mark posts). Not a positive number = misconfigured.
PILOT_LOCK_USD = "50"
# The RegiLockFactory address (contracts repo src/regilock). EMPTY until the owner deploys it: every order above 1× is
# refused and the ticket says leverage opens when the lock is live. The Pilot rules page shows this address (read from
# the account view). Set but not an address = misconfigured.
PILOT_LOCK_FACTORY = "0x5E2634D8F21A91A79A435F2D3CC49e8dB37CEb93"
# The factory's deploy block (Arc mainnet 25737926): the withdrawal watch's first run starts here, a small read.
PILOT_LOCK_FROM_BLOCK = "25737926"
# The pilot's leverage cap, applied after the engine's (volatility, jump): the ticket offers no level above it,
# POST /api/pilot/order refuses "leverage above the current cap", and /api/index/mark reports
# maxLev = min(engine cap, this). Owner decision 2026-10-11: 10 until the F1 fix is live and the attack cost is
# re-measured (audit F2). Not an integer ≥ 1 = misconfigured.
PILOT_MAX_LEV = "10"
# Wallets that may not open positions (milestone recorders, audit F4): comma-separated, lowercase. Their closes
# still work. Empty = nobody is blocked.
PILOT_BLOCKED_WALLETS = ""

# ── Secrets (NOT here: set once per project, they survive deploys) ──────────
# NONCE_SECRET   HMAC key of the stateless /admin sign-in nonces
#                (builders-site/lib/auth.ts). Without it /api/auth/nonce and
#                /api/auth/login answer 500 (fail closed); the rest of the site
#                works. Set it before the first deploy of this version:
#                  openssl rand -base64 48 | npx wrangler pages secret put NONCE_SECRET --project-name=registrai-builders
#                (run from frontend/). Rotating it invalidates only nonces
#                issued in the last 5 minutes; sessions are unaffected.
#
# PILOT_SESSION_SECRET  HMAC key of the ABI points pilot session cookie (lib/pilot-auth.ts), at
#                least 32 characters. Without it pilot sign-in answers 503 (fail closed):
#                  openssl rand -base64 48 | npx wrangler pages secret put PILOT_SESSION_SECRET --project-name=registrai-builders
#                Rotating it signs every pilot user out.
# ABI_PUSH_TOKEN (already set for /api/index) is also the bearer of POST /api/index/mark (live/mark.py).
