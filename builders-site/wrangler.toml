# Cloudflare Pages project for the standalone builders site, builder.registrai.cc
# (the /builders gallery, /verify, /admin and the badge art) plus its Pages
# Functions in ./functions (the admin API: sign-in, invites, open tracking).
#
# Deploy from frontend/: `npm run deploy:builders` (next build, then
# scripts/build-builders-site.sh packages ../dist-builders, then
# scripts/deploy-builders-site.sh runs `wrangler pages deploy` from THIS
# directory, which picks up ./functions and this file).
#
# The main site (registrai.cc, `npm run deploy`) deploys `out/` from frontend/
# and never sees these functions.
#
# With a wrangler.toml, this file is the source of truth for the project's
# bindings and variables: the dashboard shows them read-only.
name = "registrai-builders"
compatibility_date = "2026-05-01"
pages_build_output_dir = "../dist-builders"

# Invites, used sign-in nonces and admin sessions.
# Namespace "registrai-builders-invites", created 2026-09-24 with
#   npx wrangler kv namespace create registrai-builders-invites   (run from frontend/)
[[kv_namespaces]]
binding = "INVITES"
id = "9652d6f635d94fda8cf3d09ee182fa41"

[vars]
# Wallets allowed to sign in to /admin: comma-separated, lowercase.
# Empty = nobody can sign in (the rest of the site works as before).
ADMIN_ADDRESSES = "0xb7ecf980a4732b75e57e2ec80903dee3964f2573"
# Onboarders sign in to /admin to READ and send onboarding from their own wallet (the
# ISSUER_ROLE + GOVERNOR_ROLE holder); every admin API change is refused for them.
ONBOARDER_ADDRESSES = "0x80e81588175558d565ffc1f63fe0513a61316405"
# Sign-in messages, the CSRF Origin check and claim links are bound to it.
SITE_ORIGIN = "https://builder.registrai.cc"
# The only origin /api/market-proposals accepts public submissions from (CORS).
PROPOSALS_ALLOWED_ORIGIN = "https://app.registrai.cc"

# ── Secrets (NOT here: set once per project, they survive deploys) ──────────
# NONCE_SECRET   HMAC key of the stateless /admin sign-in nonces
#                (builders-site/lib/auth.ts). Without it /api/auth/nonce and
#                /api/auth/login answer 500 (fail closed); the rest of the site
#                works. Set it before the first deploy of this version:
#                  openssl rand -base64 48 | npx wrangler pages secret put NONCE_SECRET --project-name=registrai-builders
#                (run from frontend/). Rotating it invalidates only nonces
#                issued in the last 5 minutes; sessions are unaffected.
